<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>민원 접수 관리</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 60px;
    background: #f2f4f8;
    color: #1c2330;
    font-family: "맑은 고딕", "Malgun Gothic", "돋움", sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #667085; font-size: 13px; margin-bottom: 18px; }

  .card {
    background: #fff;
    border: 1px solid #dfe3ea;
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 20px;
  }
  .card > h2 {
    font-size: 16px;
    margin: 0 0 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid #eceff4;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px 16px;
  }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field.full { grid-column: 1 / -1; }
  label { font-size: 13px; font-weight: 700; color: #344054; }
  label .req { color: #d92d20; }
  label .hint { font-weight: 400; color: #98a2b3; }
  input, select, textarea {
    font: inherit;
    color: inherit;
    padding: 8px 10px;
    border: 1px solid #cfd6e0;
    border-radius: 6px;
    background: #fff;
    width: 100%;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: #2f6fed;
    box-shadow: 0 0 0 3px rgba(47,111,237,.15);
  }
  textarea { resize: vertical; min-height: 76px; }

  .btns { margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap; }
  button {
    font: inherit;
    font-weight: 700;
    cursor: pointer;
    border-radius: 6px;
    padding: 9px 20px;
    border: 1px solid transparent;
  }
  .primary { background: #2f6fed; color: #fff; }
  .primary:hover { background: #2559c9; }
  .ghost { background: #fff; color: #344054; border-color: #cfd6e0; }
  .ghost:hover { background: #f5f7fa; }

  .msg { margin-top: 12px; font-size: 13px; font-weight: 700; display: none; }
  .msg.ok { display: block; color: #067647; }
  .msg.err { display: block; color: #d92d20; }

  /* ---- 목록 위 검색·고르기 줄 ---- */
  .listhead {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 12px; flex-wrap: wrap;
    padding-bottom: 10px; margin-bottom: 12px;
    border-bottom: 1px solid #eceff4;
  }
  .listhead h2 { font-size: 16px; margin: 0; }
  .count { font-size: 13px; color: #667085; }
  .count b { color: #2f6fed; font-size: 15px; }
  .count .sep { color: #d0d5dd; margin: 0 6px; }

  .filters {
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    padding: 12px; margin-bottom: 12px;
    background: #f7f9fc; border: 1px solid #e7ebf1; border-radius: 8px;
  }
  .filters input[type="search"] { flex: 1 1 240px; min-width: 200px; }
  .filters select { width: auto; min-width: 130px; }
  .filters .ghost { padding: 8px 14px; }
  .filters .tag { font-size: 13px; font-weight: 700; color: #344054; }

  .tablebox { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 1120px; }
  th, td {
    border-bottom: 1px solid #e7ebf1;
    padding: 9px 10px;
    text-align: left;
    vertical-align: top;
    font-size: 14px;
  }
  th {
    background: #f7f9fc;
    font-size: 13px;
    color: #344054;
    white-space: nowrap;
  }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { background: #eef3fb; color: #1d4ed8; }
  th .arrow { color: #98a2b3; font-size: 11px; }
  th.sorted .arrow { color: #2f6fed; }

  td.no { color: #667085; width: 50px; }
  td.date, td.due, td.tel, td.town, td.type { white-space: nowrap; }
  td.date { width: 104px; }
  td.due { width: 152px; }
  td.tel { width: 120px; }
  td.town { width: 82px; }
  td.type { width: 100px; }
  td.status { width: 106px; }
  td.content { white-space: pre-wrap; word-break: break-word; min-width: 200px; }
  td.act { width: 72px; white-space: nowrap; }

  tbody tr:hover { background: #f9fbff; }

  /* 처리 기한이 지났는데 아직 완료가 아닌 민원: 빨간색으로 표시 */
  tr.overdue { background: #fff6f6; }
  tr.overdue:hover { background: #ffeeee; }
  tr.overdue td.date { color: #d92d20; font-weight: 700; }
  tr.overdue td.due { color: #d92d20; font-weight: 700; }
  tr.overdue td.town, tr.overdue td.tel { color: #7a2a24; }
  tr.overdue td.due::after {
    content: "기한 지남";
    display: inline-block;
    margin-left: 6px;
    padding: 1px 7px;
    border-radius: 999px;
    background: #d92d20;
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    vertical-align: 1px;
  }

  .del {
    background: #fff; color: #d92d20; border: 1px solid #f3b8b2;
    padding: 4px 12px; font-size: 13px; font-weight: 700;
  }
  .del:hover { background: #fef3f2; }

  /* 목록에서 바로 바꾸는 처리 상태 */
  select.st {
    width: auto;
    min-width: 92px;
    padding: 4px 6px;
    font-size: 13px;
    font-weight: 700;
    border-radius: 999px;
    cursor: pointer;
  }
  select.st-received { background: #fff6e8; border-color: #f0c98a; color: #b25e00; }
  select.st-doing    { background: #eaf1ff; border-color: #b9cdfb; color: #1d4ed8; }
  select.st-done     { background: #e7f7ee; border-color: #a9dfc1; color: #067647; }

  .empty { padding: 34px 10px; text-align: center; color: #98a2b3; }
  .warn {
    display: none;
    margin-bottom: 16px; padding: 10px 14px;
    background: #fffaeb; border: 1px solid #f4d27a; border-radius: 8px;
    color: #7a5b00; font-size: 13px;
  }
  @media (max-width: 860px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 560px) {
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>민원 접수 관리</h1>
  <div class="sub">민원을 접수해 등록하고, 아래 목록에서 처리 상태를 바로 바꿀 수 있습니다. 입력한 자료는 이 컴퓨터의 브라우저에 저장되어 새로고침해도 남아 있습니다.</div>

  <div class="warn" id="warn">
    이 브라우저에서는 자동 저장 기능을 쓸 수 없습니다. 창을 닫으면 목록이 사라질 수 있습니다.
  </div>

  <div class="card">
    <h2>민원 접수 입력</h2>
    <form id="form" autocomplete="off">
      <div class="grid">
        <div class="field">
          <label for="date">접수일 <span class="req">*</span></label>
          <input type="date" id="date">
        </div>
        <div class="field">
          <label for="due">처리 기한 <span class="hint">(접수일 + 7일 자동 입력)</span></label>
          <input type="date" id="due">
        </div>
        <div class="field">
          <label for="town">읍면 <span class="req">*</span></label>
          <select id="town">
            <option value="">선택하세요</option>
          </select>
        </div>
        <div class="field">
          <label for="name">민원인 <span class="req">*</span></label>
          <input type="text" id="name" maxlength="40" placeholder="예) 홍길동">
        </div>
        <div class="field">
          <label for="tel">연락처</label>
          <input type="text" id="tel" maxlength="20" placeholder="예) 010-1234-5678">
        </div>
        <div class="field">
          <label for="type">민원 유형 <span class="req">*</span></label>
          <select id="type">
            <option value="">선택하세요</option>
          </select>
        </div>
        <div class="field full">
          <label for="content">민원 내용 <span class="req">*</span></label>
          <textarea id="content" maxlength="1000" placeholder="민원 내용을 입력하세요."></textarea>
        </div>
      </div>
      <div class="btns">
        <button type="submit" class="primary">등록</button>
        <button type="reset" class="ghost" id="resetBtn">입력칸 비우기</button>
      </div>
      <div class="msg" id="msg"></div>
    </form>
  </div>

  <div class="card">
    <div class="listhead">
      <h2>접수 민원 목록</h2>
      <div class="count">
        표시 <b id="count">0</b>건
        <span class="sep">/</span> 전체 <b id="countAll">0</b>건
        <span class="sep">|</span> 접수 <b id="cReceived">0</b>
        · 처리중 <b id="cDoing">0</b>
        · 완료 <b id="cDone">0</b>
        · 기한 지남 <b id="cOver" class="overdueNum">0</b>
      </div>
    </div>

    <div class="filters">
      <span class="tag">찾기</span>
      <input type="search" id="q" placeholder="민원인 이름 또는 민원 내용으로 검색">
      <select id="fTown" title="읍면으로 골라 보기"></select>
      <select id="fStatus" title="처리 상태로 골라 보기"></select>
      <button type="button" class="ghost" id="clearFilter">조건 지우기</button>
    </div>

    <div class="tablebox">
      <table>
        <thead>
          <tr>
            <th>번호</th>
            <th class="sortable" id="thDate" title="눌러서 날짜 순으로 정렬">접수일 <span class="arrow" id="arrowDate">▼</span></th>
            <th>처리 기한</th>
            <th>읍면</th>
            <th>민원 유형</th>
            <th>민원인</th>
            <th>연락처</th>
            <th>민원 내용</th>
            <th>처리 상태</th>
            <th>관리</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="empty" id="empty">아직 등록된 민원이 없습니다.</div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var KEY = "geochang_minwon_list_v2";
  var OLDKEY = "geochang_minwon_list_v1";
  var STATUS = ["접수", "처리중", "완료"];
  var STCLASS = { "접수": "st-received", "처리중": "st-doing", "완료": "st-done" };
  var TOWNS = ["거창읍", "주상면", "웅양면", "고제면", "북상면", "위천면",
               "마리면", "남상면", "남하면", "신원면", "가조면", "가북면"];
  var TYPES = ["도로·교통", "환경·위생", "복지", "건축·주택", "농업", "기타"];

  var list = [];            /* 저장된 전체 민원 */
  var seq = 1;              /* 민원 고유 번호표 */
  var sortAsc = false;      /* 접수일 정렬: false = 최근 날짜 먼저 */
  var storageOK = true;

  var $ = function (id) { return document.getElementById(id); };
  var form = $("form"), tbody = $("tbody"), msgEl = $("msg"), emptyEl = $("empty");

  /* ---------- 저장 / 불러오기 ---------- */

  function load() {
    try {
      var raw = localStorage.getItem(KEY) || localStorage.getItem(OLDKEY);
      list = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(list)) list = [];
      list = list.filter(function (r) { return r && typeof r === "object"; });

      /* 예전 버전 자료에 빠진 항목을 채워 준다. */
      list.forEach(function (r) {
        if (STATUS.indexOf(r.status) < 0) r.status = "접수";
        if (!r.type) r.type = "기타";
        if (!r.due) r.due = addDays(r.date, 7);
        if (r.id == null) r.id = seq++;
        else if (Number(r.id) >= seq) seq = Number(r.id) + 1;
      });
    } catch (e) {
      storageOK = false;
      list = [];
    }
    if (!storageOK) $("warn").style.display = "block";
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(list));
    } catch (e) {
      storageOK = false;
      $("warn").style.display = "block";
    }
  }

  /* ---------- 작은 도구들 ---------- */

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function fmt(d) {
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + m + "-" + day;
  }

  function todayStr() { return fmt(new Date()); }

  /* 접수일 문자열(YYYY-MM-DD)에 n일을 더한 날짜를 돌려준다. */
  function addDays(str, n) {
    var p = String(str || "").split("-");
    if (p.length !== 3) return "";
    var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    if (isNaN(d.getTime())) return "";
    d.setDate(d.getDate() + n);
    return fmt(d);
  }

  function isOverdue(row) {
    return row.status !== "완료" && !!row.due && row.due < todayStr();
  }

  /* 받침 여부에 따라 "로" / "으로"를 골라 준다. (접수로, 처리중으로) */
  function josa(word) {
    var s = String(word || "");
    if (!s) return "로";
    var code = s.charCodeAt(s.length - 1);
    if (code < 0xac00 || code > 0xd7a3) return "로";
    return (code - 0xac00) % 28 === 0 ? "로" : "으로";
  }

  function showMsg(text, type) {
    msgEl.textContent = text;
    msgEl.className = "msg " + type;
    if (type === "ok") {
      window.clearTimeout(showMsg.t);
      showMsg.t = window.setTimeout(function () { msgEl.className = "msg"; }, 3000);
    }
  }

  function fillDue() {
    var d = $("date").value;
    $("due").value = d ? addDays(d, 7) : "";
  }

  function fillSelect(sel, items, allLabel) {
    var html = allLabel ? '<option value="">' + allLabel + "</option>" : '<option value="">선택하세요</option>';
    html += items.map(function (v) { return "<option>" + esc(v) + "</option>"; }).join("");
    sel.innerHTML = html;
  }

  /* ---------- 검색 · 고르기 · 정렬을 거친 목록 ---------- */

  function view() {
    var q = $("q").value.trim().toLowerCase();
    var town = $("fTown").value;
    var status = $("fStatus").value;

    var rows = list.filter(function (r) {
      if (town && r.town !== town) return false;
      if (status && r.status !== status) return false;
      if (q) {
        var hay = (String(r.name || "") + " " + String(r.content || "")).toLowerCase();
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    });

    rows.sort(function (a, b) {
      var x = String(a.date || ""), y = String(b.date || "");
      if (x === y) return (Number(a.id) || 0) - (Number(b.id) || 0);
      return sortAsc ? (x < y ? -1 : 1) : (x > y ? -1 : 1);
    });
    return rows;
  }

  function render() {
    var rows = view();

    var c = { "접수": 0, "처리중": 0, "완료": 0 }, over = 0;
    rows.forEach(function (r) {
      if (c[r.status] == null) c[r.status] = 0;
      c[r.status]++;
      if (isOverdue(r)) over++;
    });

    $("count").textContent = rows.length;
    $("countAll").textContent = list.length;
    $("cReceived").textContent = c["접수"] || 0;
    $("cDoing").textContent = c["처리중"] || 0;
    $("cDone").textContent = c["완료"] || 0;
    $("cOver").textContent = over;
    $("cOver").style.color = over ? "#d92d20" : "";

    $("arrowDate").textContent = sortAsc ? "▲" : "▼";
    $("thDate").className = "sortable sorted";

    if (!rows.length) {
      emptyEl.textContent = list.length ? "조건에 맞는 민원이 없습니다." : "아직 등록된 민원이 없습니다.";
      emptyEl.style.display = "block";
    } else {
      emptyEl.style.display = "none";
    }

    tbody.innerHTML = rows.map(function (row, i) {
      var opts = STATUS.map(function (s) {
        return '<option value="' + s + '"' + (row.status === s ? " selected" : "") + ">" + s + "</option>";
      }).join("");
      var cls = STCLASS[row.status] || "st-received";

      return '<tr' + (isOverdue(row) ? ' class="overdue"' : "") + ">" +
        '<td class="no">' + (i + 1) + "</td>" +
        '<td class="date">' + esc(row.date) + "</td>" +
        '<td class="due">' + (row.due ? esc(row.due) : "-") + "</td>" +
        '<td class="town">' + esc(row.town) + "</td>" +
        '<td class="type">' + esc(row.type) + "</td>" +
        "<td>" + esc(row.name) + "</td>" +
        '<td class="tel">' + (row.tel ? esc(row.tel) : "-") + "</td>" +
        '<td class="content">' + esc(row.content) + "</td>" +
        '<td class="status"><select class="st ' + cls + '" data-id="' + row.id + '" title="처리 상태 바꾸기">' + opts + "</select></td>" +
        '<td class="act"><button type="button" class="del" data-id="' + row.id + '">삭제</button></td>' +
      "</tr>";
    }).join("");
  }

  function findById(id) {
    for (var i = 0; i < list.length; i++) {
      if (String(list[i].id) === String(id)) return i;
    }
    return -1;
  }

  /* ---------- 등록 ---------- */

  form.addEventListener("submit", function (e) {
    e.preventDefault();

    var date = $("date").value.trim();
    var due = $("due").value.trim();
    var town = $("town").value;
    var name = $("name").value.trim();
    var tel = $("tel").value.trim();
    var type = $("type").value;
    var content = $("content").value.trim();

    if (!date) { showMsg("접수일을 입력하세요.", "err"); $("date").focus(); return; }
    if (!town) { showMsg("읍면을 선택하세요.", "err"); $("town").focus(); return; }
    if (!type) { showMsg("민원 유형을 선택하세요.", "err"); $("type").focus(); return; }
    if (!name) { showMsg("민원인 이름을 입력하세요.", "err"); $("name").focus(); return; }
    if (!content) { showMsg("민원 내용을 입력하세요.", "err"); $("content").focus(); return; }
    if (tel && !/^[0-9()+\-.\s]{7,20}$/.test(tel)) {
      showMsg("연락처는 숫자와 - 기호로 입력하세요. (예: 010-1234-5678)", "err");
      $("tel").focus(); return;
    }
    if (!due) due = addDays(date, 7);

    list.push({
      id: seq++,
      date: date,
      due: due,
      town: town,
      name: name,
      tel: tel,
      type: type,
      content: content,
      status: "접수",
      savedAt: new Date().toISOString()
    });
    save();
    render();
    showMsg("등록되었습니다. (처리 기한 " + due + ", 전체 " + list.length + "건)", "ok");

    $("name").value = "";
    $("tel").value = "";
    $("town").value = "";
    $("type").value = "";
    $("content").value = "";
    $("date").value = todayStr();
    fillDue();
    $("name").focus();
  });

  /* ---------- 목록 안에서 상태 바꾸기 / 삭제 ---------- */

  tbody.addEventListener("change", function (e) {
    var sel = e.target.closest("select.st");
    if (!sel) return;
    var i = findById(sel.getAttribute("data-id"));
    if (i < 0) return;
    var row = list[i];
    row.status = sel.value;
    save();
    render();
    showMsg("'" + row.name + "' 님의 민원을 " + row.status + josa(row.status) + " 바꿨습니다.", "ok");
  });

  tbody.addEventListener("click", function (e) {
    var btn = e.target.closest(".del");
    if (!btn) return;
    var i = findById(btn.getAttribute("data-id"));
    if (i < 0) return;
    var row = list[i];
    if (!window.confirm("'" + row.name + "' 님의 민원을 삭제할까요?")) return;
    list.splice(i, 1);
    save();
    render();
    showMsg("삭제되었습니다.", "ok");
  });

  /* ---------- 검색창 · 고르기 칸 · 정렬 ---------- */

  $("q").addEventListener("input", render);
  $("fTown").addEventListener("change", render);
  $("fStatus").addEventListener("change", render);

  $("clearFilter").addEventListener("click", function () {
    $("q").value = "";
    $("fTown").value = "";
    $("fStatus").value = "";
    render();
    $("q").focus();
  });

  /* 접수일 제목을 누르면 날짜 순으로 정렬(한 번 더 누르면 반대 순서) */
  $("thDate").addEventListener("click", function () {
    sortAsc = !sortAsc;
    render();
  });

  /* 접수일을 바꾸면 처리 기한(접수일 + 7일)도 다시 계산한다. */
  $("date").addEventListener("change", fillDue);
  $("date").addEventListener("input", fillDue);

  $("resetBtn").addEventListener("click", function () {
    window.setTimeout(function () {
      $("date").value = todayStr();
      fillDue();
      $("name").focus();
    }, 0);
  });

  /* ---------- 시작 ---------- */

  fillSelect($("town"), TOWNS, null);
  fillSelect($("type"), TYPES, null);
  fillSelect($("fTown"), TOWNS, "읍면 전체");
  fillSelect($("fStatus"), STATUS, "상태 전체");

  load();
  save();
  $("date").value = todayStr();
  fillDue();
  render();
})();
</script>
</body>
</html>
