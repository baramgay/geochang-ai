<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회의록</title>
<style>
  html, body { margin: 0; padding: 0; }
  body {
    background: #eef1f6;
    color: #1b2a41;
    font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
    font-size: 15px;
    line-height: 1.6;
    padding-bottom: 40px;
  }

  /* ── 화면 위쪽 도구 모음 (인쇄할 때는 나오지 않습니다) ── */
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    padding: 12px 20px;
    background: #1b2a41;
    color: #ffffff;
  }
  .toolbar button {
    padding: 8px 16px;
    border: 0;
    border-radius: 6px;
    background: #ffffff;
    color: #1b2a41;
    font-family: inherit;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
  }
  .toolbar button:hover { background: #dbe6f5; }
  .toolbar .hint {
    margin-left: auto;
    font-size: 13px;
    color: #c8d4e6;
  }

  /* ── A4 한 장 ── */
  .page {
    box-sizing: border-box;
    width: 210mm;
    min-height: 297mm;
    margin: 20px auto;
    padding: 14mm 15mm;
    background: #ffffff;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.15);
  }

  /* ── 문서 머리 : 왼쪽 여백 / 가운데 제목 / 오른쪽 결재란 ── */
  .doc-head {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: start;
    margin-bottom: 4mm;
  }
  .doc-head h1 {
    margin: 0;
    padding-top: 2mm;
    font-size: 26px;
    letter-spacing: 8px;
    text-align: center;
  }
  .doc-head .subtitle {
    margin: 1mm 0 0;
    font-size: 12px;
    color: #6b7a90;
    text-align: center;
  }
  .head-right { display: flex; justify-content: flex-end; }

  /* 결재란 */
  table.approval {
    width: auto;
    table-layout: fixed;
    border-collapse: collapse;
    font-size: 12px;
  }
  table.approval th,
  table.approval td {
    width: 34px;
    border: 1px solid #9aa8bb;
    padding: 2px 3px;
    text-align: center;
    vertical-align: middle;
    word-break: keep-all;
  }
  table.approval th { background: #f0f4fa; letter-spacing: 3px; }
  table.approval td.sign-box { height: 15mm; }
  table.approval td.sign-box:focus { background: #fffbe8; }

  h2 {
    margin: 4mm 0 1.5mm;
    padding-left: 8px;
    border-left: 5px solid #2b5d9e;
    font-size: 15px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }
  th, td {
    border: 1px solid #9aa8bb;
    padding: 4px 9px;
    vertical-align: top;
    word-break: break-all;
  }
  th {
    width: 105px;
    background: #f0f4fa;
    font-weight: bold;
    text-align: center;
    vertical-align: middle;
  }
  td.mid { vertical-align: middle; }

  /* 논의 내용 / 결정 사항처럼 넓게 쓰는 칸 */
  .cell { min-height: 16mm; }
  .cell.tall { min-height: 56mm; }
  .cell.decide { min-height: 38mm; }

  /* 참석자 칸 : 여섯 명까지 (왼쪽 1~3번, 오른쪽 4~6번) */
  table.people {
    width: 100%;
    table-layout: fixed;
    border-collapse: collapse;
    font-size: 13px;
  }
  table.people td {
    border: 0;
    padding: 2px 5px;
    vertical-align: middle;
  }
  table.people td.num {
    width: 20px;
    color: #6b7a90;
    text-align: center;
  }
  table.people td[contenteditable="true"] { border-bottom: 1px dotted #cfd7e0; }

  /* 입력하는 칸 */
  [contenteditable="true"]:focus {
    background: #fffbe8;
    outline: 2px solid #f0c14b;
  }
  [contenteditable="true"]:empty::before {
    content: attr(data-placeholder);
    color: #a9b4c4;
  }

  /* 후속 조치 표 */
  #fuTable th { padding: 5px 9px; }
  #fuTable td { height: 8.5mm; }
  #fuTable td.num { text-align: center; vertical-align: middle; }
  .del {
    padding: 0 5px;
    border: 0;
    background: none;
    color: #d64545;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
  }

  .sign {
    margin: 5mm 0 0;
    text-align: right;
    font-size: 13px;
  }
  .sign .line {
    display: inline-block;
    min-width: 120px;
    border-bottom: 1px solid #1b2a41;
    text-align: center;
  }

  /* 맨 아래 인쇄 버튼 (인쇄할 때는 나오지 않습니다) */
  .bottom-bar { margin: 22px 0 0; text-align: center; }
  .bottom-bar button {
    padding: 12px 44px;
    border: 0;
    border-radius: 8px;
    background: #2b5d9e;
    color: #ffffff;
    font-family: inherit;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }
  .bottom-bar button:hover { background: #1b2a41; }

  /* ── 인쇄 설정 : A4 한 장 ── */
  @page { size: A4 portrait; margin: 14mm 15mm; }
  @media print {
    body { background: #ffffff; padding: 0; font-size: 11pt; }
    .toolbar, .no-print { display: none !important; }
    .page {
      width: auto;
      min-height: 0;
      margin: 0;
      padding: 0;
      box-shadow: none;
    }
    [contenteditable="true"]:empty::before { content: ""; }
    [contenteditable="true"]:focus { background: none; outline: none; }
    table, tr, td, th { page-break-inside: avoid; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <button type="button" onclick="doPrint()">인쇄 / PDF 저장</button>
  <button type="button" onclick="addRow()">후속 조치 줄 추가</button>
  <button type="button" onclick="fillToday()">오늘 날짜 넣기</button>
  <button type="button" onclick="clearAll()">내용 지우기</button>
  <span class="hint">회색 안내 글씨가 있는 칸을 눌러 바로 입력하세요. 입력한 내용은 이 PC에 자동 저장됩니다.</span>
</div>

<div class="page" id="sheet">

  <div class="doc-head">
    <div></div>
    <div>
      <h1>회의록</h1>
      <p class="subtitle">거창군청</p>
    </div>
    <div class="head-right">
      <table class="approval">
        <tr>
          <th colspan="3">결 재</th>
        </tr>
        <tr>
          <td>담당</td>
          <td>팀장</td>
          <td>과장</td>
        </tr>
        <tr>
          <td class="sign-box" contenteditable="true" id="f-app1"></td>
          <td class="sign-box" contenteditable="true" id="f-app2"></td>
          <td class="sign-box" contenteditable="true" id="f-app3"></td>
        </tr>
      </table>
    </div>
  </div>

  <table>
    <tr>
      <th>일 시</th>
      <td class="mid" contenteditable="true" id="f-datetime"
          data-placeholder="2026. 00. 00.(월) 00:00 ~ 00:00"></td>
      <th>장 소</th>
      <td class="mid" contenteditable="true" id="f-place"
          data-placeholder="예) 군청 3층 회의실"></td>
    </tr>
    <tr>
      <th>참석자<br><span style="font-weight:normal;font-size:11px;color:#6b7a90">(6명까지)</span></th>
      <td colspan="3">
        <table class="people">
          <tr>
            <td class="num">1</td>
            <td contenteditable="true" id="f-p1" data-placeholder="소속·직위·성명"></td>
            <td class="num">4</td>
            <td contenteditable="true" id="f-p4" data-placeholder="소속·직위·성명"></td>
          </tr>
          <tr>
            <td class="num">2</td>
            <td contenteditable="true" id="f-p2" data-placeholder="소속·직위·성명"></td>
            <td class="num">5</td>
            <td contenteditable="true" id="f-p5" data-placeholder="소속·직위·성명"></td>
          </tr>
          <tr>
            <td class="num">3</td>
            <td contenteditable="true" id="f-p3" data-placeholder="소속·직위·성명"></td>
            <td class="num">6</td>
            <td contenteditable="true" id="f-p6" data-placeholder="소속·직위·성명"></td>
          </tr>
        </table>
      </td>
    </tr>
  </table>

  <h2>안건</h2>
  <div class="cell" contenteditable="true" id="f-agenda"
       data-placeholder="1. 안건 첫 번째 / 2. 안건 두 번째 처럼 번호를 붙여 적습니다."></div>

  <h2>논의 내용</h2>
  <div class="cell tall" contenteditable="true" id="f-talk"
       data-placeholder="안건별로 논의된 내용과 나온 의견을 적습니다."></div>

  <h2>결정 사항</h2>
  <div class="cell decide" contenteditable="true" id="f-decide"
       data-placeholder="회의에서 최종 결정된 내용을 적습니다."></div>

  <h2>후속 조치</h2>
  <table id="fuTable">
    <colgroup>
      <col style="width:44px">
      <col>
      <col style="width:110px">
      <col style="width:110px">
    </colgroup>
    <tr>
      <th>번호</th>
      <th>조치 내용</th>
      <th>담당자</th>
      <th>기한</th>
      <th class="no-print" style="width:36px"></th>
    </tr>
    <tbody id="fuBody"></tbody>
  </table>

  <p class="sign">
    작성일 : <span class="line" contenteditable="true" id="f-wdate" data-placeholder="2026. 00. 00."></span>
    &nbsp;&nbsp;
    작성자 : <span class="line" contenteditable="true" id="f-writer" data-placeholder=""></span>
    &nbsp;(서명)
  </p>

</div>

<div class="bottom-bar no-print">
  <button type="button" onclick="doPrint()">인쇄하기</button>
</div>

<script>
/* ===== 입력칸 목록 ===== */
var FIELDS = ["f-datetime", "f-place",
              "f-p1", "f-p2", "f-p3", "f-p4", "f-p5", "f-p6",
              "f-agenda", "f-talk", "f-decide",
              "f-app1", "f-app2", "f-app3",
              "f-wdate", "f-writer"];
var KEY = "geochang_meeting_minutes";

function el(id) { return document.getElementById(id); }

/* ===== 후속 조치 표 : 줄 만들기 ===== */
var ROW_COUNT = 4;

function makeRow(values) {
  var tr = document.createElement("tr");
  var cells = [
    { cls: "num" },
    { cls: "", ph: "후속 조치 내용" },
    { cls: "", ph: "담당자" },
    { cls: "", ph: "0000. 00. 00." },
    { cls: "no-print", del: true }
  ];
  for (var i = 0; i < cells.length; i++) {
    var td = document.createElement("td");
    td.className = cells[i].cls;
    if (cells[i].del) {
      td.innerHTML = '<button type="button" class="del" title="이 줄 삭제">&#10005;</button>';
    } else if (cells[i].cls === "num") {
      td.textContent = "";
    } else {
      td.setAttribute("contenteditable", "true");
      td.setAttribute("data-placeholder", cells[i].ph);
      if (values && values[i - 1]) { td.innerHTML = values[i - 1]; }
    }
    tr.appendChild(td);
  }
  return tr;
}

function renumber() {
  var rows = el("fuBody").rows;
  for (var i = 0; i < rows.length; i++) { rows[i].cells[0].textContent = i + 1; }
}

function addRow(values) {
  el("fuBody").appendChild(makeRow(values || null));
  renumber();
  save();
}

/* ===== 저장 / 불러오기 (이 PC 안에만 저장) ===== */
function save() {
  try {
    var data = { fields: {}, rows: [] };
    for (var i = 0; i < FIELDS.length; i++) {
      data.fields[FIELDS[i]] = el(FIELDS[i]).innerHTML;
    }
    var rows = el("fuBody").rows;
    for (var r = 0; r < rows.length; r++) {
      data.rows.push([
        rows[r].cells[1].innerHTML,
        rows[r].cells[2].innerHTML,
        rows[r].cells[3].innerHTML
      ]);
    }
    localStorage.setItem(KEY, JSON.stringify(data));
  } catch (e) { /* 저장이 막힌 환경이면 그냥 넘어갑니다 */ }
}

function load() {
  var raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) { raw = null; }
  if (!raw) { return false; }
  var data;
  try { data = JSON.parse(raw); } catch (e) { return false; }
  for (var i = 0; i < FIELDS.length; i++) {
    if (data.fields && data.fields[FIELDS[i]] != null) {
      el(FIELDS[i]).innerHTML = data.fields[FIELDS[i]];
    }
  }
  if (data.rows && data.rows.length) {
    el("fuBody").innerHTML = "";
    for (var r = 0; r < data.rows.length; r++) {
      el("fuBody").appendChild(makeRow(data.rows[r]));
    }
  }
  renumber();
  return true;
}

/* ===== 버튼 기능 ===== */
function fillToday() {
  var d = new Date();
  var day = ["일", "월", "화", "수", "목", "금", "토"][d.getDay()];
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  var full = d.getFullYear() + ". " + pad(d.getMonth() + 1) + ". " + pad(d.getDate()) + ".(" + day + ")";
  var short = d.getFullYear() + ". " + pad(d.getMonth() + 1) + ". " + pad(d.getDate()) + ".";
  if (el("f-datetime").textContent.trim() === "") { el("f-datetime").textContent = full + " 00:00 ~ 00:00"; }
  if (el("f-wdate").textContent.trim() === "") { el("f-wdate").textContent = short; }
  save();
}

function clearAll() {
  if (!confirm("입력한 내용을 모두 지웁니다. 계속할까요?")) { return; }
  for (var i = 0; i < FIELDS.length; i++) { el(FIELDS[i]).innerHTML = ""; }
  el("fuBody").innerHTML = "";
  for (var r = 0; r < ROW_COUNT; r++) { addRow(); }
  renumber();
  save();
}

/* ===== A4 한 장에 맞추어 인쇄 ===== */
var PAGE_MM = 269;                       /* A4 높이 297mm - 위아래 여백 14mm씩 */
function mmToPx(mm) { return mm * 96 / 25.4; }

function fitPrint() {
  var sheet = el("sheet");
  /* 인쇄될 때와 같은 폭(180mm), 여백 없음 상태로 높이를 재어 봅니다 */
  var prev = {
    zoom: sheet.style.zoom,
    width: sheet.style.width,
    minHeight: sheet.style.minHeight,
    padding: sheet.style.padding
  };
  sheet.style.zoom = "1";
  sheet.style.width = "180mm";
  sheet.style.minHeight = "0";
  sheet.style.padding = "0";
  var limit = mmToPx(PAGE_MM);
  var h = sheet.scrollHeight;
  sheet.style.zoom = prev.zoom;
  sheet.style.width = prev.width;
  sheet.style.minHeight = prev.minHeight;
  sheet.style.padding = prev.padding;

  if (h > limit) {
    var z = limit / h * 0.99;
    if (z < 0.6) { z = 0.6; }            /* 너무 작아지지 않게 최소 크기 */
    sheet.style.zoom = z.toFixed(3);
  }
}

function doPrint() {
  fitPrint();
  window.print();
}

window.addEventListener("beforeprint", fitPrint);
window.addEventListener("afterprint", function () { el("sheet").style.zoom = "1"; });

/* ===== 시작 ===== */
if (!load()) {
  for (var i = 0; i < ROW_COUNT; i++) { addRow(); }
}
renumber();

/* 입력할 때마다 자동 저장, 표의 삭제 단추 처리 */
document.addEventListener("input", save);
document.getElementById("fuTable").addEventListener("click", function (e) {
  if (e.target && e.target.classList.contains("del")) {
    var tr = e.target.closest("tr");
    if (el("fuBody").rows.length <= 1) { tr.cells[1].innerHTML = ""; tr.cells[2].innerHTML = ""; tr.cells[3].innerHTML = ""; }
    else { tr.parentNode.removeChild(tr); }
    renumber();
    save();
  }
});
/* 표 칸에서는 Enter 를 눌러도 줄이 늘어나지 않게 막습니다 */
document.getElementById("fuTable").addEventListener("keydown", function (e) {
  if (e.key === "Enter") { e.preventDefault(); }
});
</script>

</body>
</html>
