<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회의록</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #eef2f6; font-family: "맑은 고딕", "Malgun Gothic", sans-serif; color: #222; }
  .wrap { max-width: 800px; margin: 20px auto; padding: 0 12px; }
  .paper { background: #fff; border: 1px solid #999; border-radius: 10px; padding: 28px 26px; }
  h1 { text-align: center; font-size: 30px; margin: 0 0 4px 0; letter-spacing: 12px; }
  .sub { text-align: center; color: #666; font-size: 13px; margin-bottom: 16px; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .title-box { flex: 1; text-align: center; padding-top: 18px; }
  table.sign { border-collapse: collapse; flex: none; }
  table.sign th, table.sign td { border: 1px solid #888; font-size: 13px; text-align: center; padding: 4px 6px; width: 58px; }
  table.sign th { background: #f0f4f8; }
  table.sign td { height: 48px; }
  table.sign td input { border: none; padding: 2px; text-align: center; }
  .attend { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  table.info { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
  table.info th, table.info td { border: 1px solid #888; padding: 6px 8px; font-size: 14px; }
  table.info th { background: #f0f4f8; width: 95px; text-align: center; white-space: nowrap; }
  table.todo { width: 100%; border-collapse: collapse; }
  table.todo th, table.todo td { border: 1px solid #888; padding: 6px; font-size: 14px; text-align: center; }
  table.todo th { background: #f0f4f8; }
  input[type="text"], input[type="date"], input[type="time"], textarea {
    width: 100%; border: 1px solid #bbb; border-radius: 5px; padding: 7px;
    font-size: 14px; font-family: inherit; background: #fff; color: #222;
  }
  .row2 { display: flex; gap: 6px; }
  .row2 input { flex: 1; }
  textarea { min-height: 70px; resize: vertical; line-height: 1.5; }
  textarea.tall { min-height: 90px; }
  .label { font-weight: bold; font-size: 15px; margin: 12px 0 5px 0; }
  .btns { display: flex; gap: 8px; margin-top: 16px; }
  button { flex: 1; padding: 11px; font-size: 15px; border-radius: 8px; border: 1px solid #1a3c5e; cursor: pointer; }
  .print { background: #1a3c5e; color: #fff; }
  .sub2 { background: #fff; color: #1a3c5e; }
  .tip { font-size: 12px; color: #666; margin-top: 8px; text-align: center; }
  .small-btn { flex: none; padding: 4px 12px; font-size: 13px; margin-top: 6px; }
  @page { size: A4; margin: 15mm 14mm; }
  @media print {
    body { background: #fff; }
    .wrap { margin: 0; max-width: none; padding: 0; }
    .paper { border: none; border-radius: 0; padding: 0; }
    .btns, .tip, .no-print { display: none !important; }
    h1 { font-size: 24px; }
    table.info th, table.info td, table.todo th, table.todo td { font-size: 12px; padding: 5px 6px; }
    input[type="text"], input[type="date"], input[type="time"] { border: none; padding: 2px; font-size: 12px; }
    textarea { border: none; padding: 2px; font-size: 12px; min-height: 55px; overflow: hidden; }
    textarea.tall { min-height: 65px; }
    .label { font-size: 13px; margin: 8px 0 3px 0; }
    .sub { margin-bottom: 10px; }
    table.sign th, table.sign td { font-size: 11px; padding: 3px 4px; }
    table.sign td { height: 38px; }
    .attend { gap: 4px; }
    .attend input { font-size: 12px; padding: 4px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="paper">
    <div class="top">
      <div style="width:190px"></div>
      <div class="title-box">
        <h1>회 의 록</h1>
        <div class="sub">칸을 눌러 바로 입력한 뒤, 인쇄 버튼을 누르면 A4 한 장으로 나옵니다</div>
      </div>
      <table class="sign" aria-label="결재란">
        <tr><th>담당</th><th>팀장</th><th>과장</th></tr>
        <tr><td><input type="text" aria-label="담당 결재"></td><td><input type="text" aria-label="팀장 결재"></td><td><input type="text" aria-label="과장 결재"></td></tr>
      </table>
    </div>

    <table class="info">
      <tr>
        <th>회의명</th>
        <td><input type="text" id="t1" placeholder="예: 10월 주간업무회의"></td>
      </tr>
      <tr>
        <th>일시</th>
        <td>
          <div class="row2">
            <input type="date" id="d1" aria-label="날짜">
            <input type="time" id="t2" aria-label="시간">
            <input type="text" id="t3" placeholder="예: 10:00~11:00" aria-label="시간대" style="max-width:140px">
          </div>
        </td>
      </tr>
      <tr>
        <th>장소</th>
        <td><input type="text" placeholder="예: 군청 2층 회의실"></td>
      </tr>
      <tr>
        <th>참석자</th>
        <td>
          <div class="attend">
            <input type="text" placeholder="참석자 1" aria-label="참석자 1">
            <input type="text" placeholder="참석자 2" aria-label="참석자 2">
            <input type="text" placeholder="참석자 3" aria-label="참석자 3">
            <input type="text" placeholder="참석자 4" aria-label="참석자 4">
            <input type="text" placeholder="참석자 5" aria-label="참석자 5">
            <input type="text" placeholder="참석자 6" aria-label="참석자 6">
          </div>
        </td>
      </tr>
      <tr>
        <th>작성자</th>
        <td><input type="text" placeholder="예: 홍길동"></td>
      </tr>
    </table>

    <div class="label">1. 안건</div>
    <textarea placeholder="예: 1. 가을 축제 준비 현황&#10;2. 민원 응대 개선 방안"></textarea>

    <div class="label">2. 논의 내용</div>
    <textarea class="tall" placeholder="나온 의견을 자유롭게 적으세요."></textarea>

    <div class="label">3. 결정 사항</div>
    <textarea placeholder="예: 축제 리플릿 10월 20일까지 제작 완료"></textarea>

    <div class="label">4. 후속 조치 (담당자 · 기한)</div>
    <table class="todo" id="todo">
      <tr><th style="width:36px">번호</th><th>할 일</th><th style="width:90px">담당자</th><th style="width:120px">기한</th></tr>
      <tr><td>1</td><td><input type="text" placeholder="할 일"></td><td><input type="text" placeholder="누가"></td><td><input type="text" placeholder="예: 10.20까지"></td></tr>
      <tr><td>2</td><td><input type="text"></td><td><input type="text"></td><td><input type="text"></td></tr>
      <tr><td>3</td><td><input type="text"></td><td><input type="text"></td><td><input type="text"></td></tr>
    </table>
    <div class="no-print"><button class="sub2 small-btn" id="addBtn" type="button">+ 후속 조치 행 추가</button></div>

    <div class="btns">
      <button class="print" type="button" onclick="fitAndPrint()">인쇄하기</button>
      <button class="sub2" type="button" onclick="if(confirm('내용을 모두 지울까요?')) location.reload()">새로 쓰기</button>
    </div>
    <div class="tip">인쇄창에서 용지 A4, 여백 기본값이면 한 장에 나옵니다. 내용이 길면 글자가 다음 장으로 넘어갈 수 있습니다.</div>
  </div>
</div>

<script>
function fitAndPrint() {
  document.querySelectorAll('textarea').forEach(function(el){
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  });
  window.print();
}
document.getElementById('addBtn').onclick = function(){
  var tb = document.getElementById('todo');
  var n = tb.rows.length;
  var tr = tb.insertRow(-1);
  tr.insertCell(0).textContent = n;
  for (var i = 0; i < 3; i++) {
    var td = tr.insertCell(i + 1);
    var inp = document.createElement('input');
    inp.type = 'text';
    td.appendChild(inp);
  }
  tr.style.textAlign = 'center';
  tr.cells[0].style.textAlign = 'center';
};
</script>
</body>
</html>
